<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Dashboard — GST Master</title>
<meta name="theme-color" content="#001839" />
<link rel="icon" href="assets/icons/logo-icon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.json" />

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

<div class="app-shell">

  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <!-- Sidebar (customer: just Dashboard + Logout, nothing else) -->
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">
        <svg class="brand-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#ffffff" fill-opacity="0.08"/>
          <path d="M32 8 L54 8 L54 40 C54 49.9 45.9 58 36 58 L32 58 Z" fill="#bc9a54"/>
          <path d="M10 8 L32 8 L32 58 L28 58 C17.5 58 10 49.9 10 40 Z" fill="#ffffff" fill-opacity="0.16"/>
          <path d="M22 33 L29 40 L43 24" fill="none" stroke="#f5f1e8" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>
          GST MASTER
          <span class="brand-sub">Client Portal</span>
        </span>
      </span>
    </div>

    <nav class="sidebar-nav">
      <a href="customer-dashboard.html" class="nav-link active"><i class="fa-solid fa-gauge-high"></i> My Dashboard</a>
    </nav>

    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="sidebarUserAvatar">GM</div>
        <div>
          <div class="name" id="sidebarUserName">—</div>
          <div class="role" id="sidebarUserRole">—</div>
        </div>
      </div>
      <a href="#" id="logoutBtn" class="nav-link mt-2 mb-0 px-0"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
  </aside>

  <div class="app-main-wrap flex-grow-1 d-flex flex-column" style="min-width:0;">

    <!-- Topbar -->
    <header class="app-topbar">
      <div class="d-flex align-items-center gap-3" style="min-width:0;">
        <button id="sidebarBurger" class="sidebar-burger" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
        <div class="fw-semibold" id="topbarWelcome">Welcome</div>
      </div>
      <button id="themeToggleBtn" class="btn btn-icon" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
    </header>

    <!-- Main content -->
    <main class="app-main">

      <div class="ledger-card mb-3 p-3">
        <h5 class="mb-1" id="cdBusinessName">—</h5>
        <div class="small text-muted-soft">
          GSTIN: <span class="font-mono" id="cdGstin">—</span>
          &nbsp;·&nbsp; Frequency: <span id="cdFrequency">—</span>
          &nbsp;·&nbsp; Status: <span id="cdStatus">—</span>
        </div>
      </div>

      <!-- Stat cards -->
      <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
          <div class="ledger-card stat-card fade-in stagger-1">
            <div class="stat-icon badge-soft-warning"><i class="fa-solid fa-file-circle-exclamation"></i></div>
            <div class="stat-value skeleton" id="statGstr1Pending">0</div>
            <div class="stat-label">GSTR-1 Pending</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="ledger-card stat-card fade-in stagger-2">
            <div class="stat-icon badge-soft-warning"><i class="fa-solid fa-file-circle-exclamation"></i></div>
            <div class="stat-value skeleton" id="statGstr3bPending">0</div>
            <div class="stat-label">GSTR-3B Pending</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="ledger-card stat-card fade-in stagger-3">
            <div class="stat-icon badge-soft-danger"><i class="fa-solid fa-indian-rupee-sign"></i></div>
            <div class="stat-value skeleton" id="statPaymentsPendingCount">0</div>
            <div class="stat-label">Payments Pending</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="ledger-card stat-card fade-in stagger-4">
            <div class="stat-icon badge-soft-danger"><i class="fa-solid fa-wallet"></i></div>
            <div class="stat-value skeleton" id="statPaymentsPendingAmount">₹0</div>
            <div class="stat-label">Amount Due</div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <!-- GST Filing Status -->
        <div class="col-lg-7">
          <div class="ledger-card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="mb-0">GST Filing Status — FY <span id="cdFyLabel"></span></h6>
            </div>
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0">
                <thead>
                  <tr>
                    <th>Period</th>
                    <th>GSTR-1</th>
                    <th>GSTR-3B</th>
                  </tr>
                </thead>
                <tbody id="cdFilingBody">
                  <tr><td colspan="3" class="text-center text-muted-soft py-4">Loading…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Payments -->
        <div class="col-lg-5">
          <div class="ledger-card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="mb-0">Pending Payments</h6>
              <a href="#" id="cdViewStatementBtn" class="btn btn-navy btn-sm"><i class="fa-solid fa-file-invoice me-1"></i>View Statement</a>
            </div>
            <div id="cdPaymentsList">
              <p class="text-center text-muted-soft py-4 mb-0">Loading…</p>
            </div>
          </div>

          <div class="ledger-card p-3 mt-3">
            <h6 class="mb-2">Recent Payments</h6>
            <div id="cdPaymentHistory">
              <p class="text-center text-muted-soft py-3 mb-0">Loading…</p>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="assets/js/customer-dashboard.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js').catch(function (err) {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
