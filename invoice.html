<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Invoice — GST Master</title>
<meta name="theme-color" content="#1a3049" />
<link rel="icon" href="assets/icons/logo-icon.svg" type="image/svg+xml" />

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
<link rel="stylesheet" href="assets/css/invoice.css">
</head>
<body>

<div class="invoice-wrap">
  <div class="no-print d-flex justify-content-between align-items-center mb-3">
    <a href="payments.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
    <button id="printBtn" class="btn btn-navy btn-sm"><i class="fa-solid fa-print me-1"></i> Print / Save PDF</button>
  </div>

  <div id="invoiceRoot">
    <div class="ledger-card text-center text-muted-soft py-5" id="invoiceLoading">Loading invoice…</div>
  </div>
</div>

<script type="module" src="assets/js/invoice.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
