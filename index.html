<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GST Master — Sign In</title>
<meta name="description" content="GST Master — GST Consulting Office Management System" />
<meta name="theme-color" content="#1a3049" />
<link rel="icon" href="assets/icons/logo-icon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.json" />

<!-- Bootstrap 5 (CDN, free) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome (CDN, free) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<!-- Google Fonts (CDN, free) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

<div class="login-shell">
  <div class="challan-wrap">
    <div class="neon-ring" aria-hidden="true"></div>

    <div class="challan" role="group" aria-label="GST Master sign in">

      <!-- top perforation -->
      <div class="perf perf-top" aria-hidden="true"></div>

      <section class="challan-applicant">
        <span class="brand-mark">
          GST MASTER
          <span class="brand-sub">GST Office Management</span>
        </span>

        <div class="applicant-topline">
          <h2 class="font-display mb-0">Sign in to <span id="activeRoleLabel">Admin Login</span></h2>
          <button id="themeToggleBtn" type="button" class="theme-toggle-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
        <p class="text-muted-soft small applicant-hint">Choose a login type, then sign in with your credentials.</p>

        <div class="role-stamps" role="tablist" aria-label="Login type">
          <div class="role-card active" data-role="admin" role="tab" tabindex="0" aria-pressed="true">
            <div class="stamp-ring"><i class="fa-solid fa-user-shield"></i></div>
            <div class="role-title">Admin</div>
          </div>
          <div class="role-card" data-role="staff" role="tab" tabindex="0" aria-pressed="false">
            <div class="stamp-ring"><i class="fa-solid fa-user-tie"></i></div>
            <div class="role-title">Staff</div>
          </div>
          <div class="role-card" data-role="customer" role="tab" tabindex="0" aria-pressed="false">
            <div class="stamp-ring"><i class="fa-solid fa-building-user"></i></div>
            <div class="role-title">Customer</div>
          </div>
        </div>
        <p class="role-desc" id="roleDesc">Full control over clients, staff &amp; settings</p>

        <div class="login-form-card">
          <form id="loginForm" novalidate>
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="loginUsername" placeholder="Username" autocomplete="username" required>
              <label id="usernameLabel" for="loginUsername">Admin Username</label>
            </div>
            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
              <label for="loginPassword">Password</label>
            </div>

            <div class="d-flex align-items-center justify-content-between mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label small text-muted-soft" for="rememberMe">Remember me on this device</label>
              </div>
              <a href="#" id="forgotPasswordLink" class="small">Forgot password?</a>
            </div>

            <button id="loginSubmitBtn" type="submit" class="btn btn-navy w-100 py-2">Sign In</button>
          </form>
        </div>

        <p class="login-footnote">GST Master v1.0</p>
      </section>

      <!-- bottom perforation -->
      <div class="perf perf-bottom" aria-hidden="true"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="assets/js/login.js"></script>
<script>
  // Keeps the visual "selected" state (colored ring + description) in sync
  // for every role card, independent of the module script's own timing.
  // Does not touch app/auth logic.
  (function () {
    const roleDescMap = {
      admin: "Full control over clients, staff &amp; settings",
      staff: "Manage your assigned clients' filings",
      customer: "View your GST &amp; payment status",
    };
    const desc = document.getElementById("roleDesc");
    const cards = document.querySelectorAll(".role-card");
    cards.forEach((card) => {
      card.addEventListener("click", () => sync(card.dataset.role));
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          sync(card.dataset.role);
        }
      });
    });
    function sync(role) {
      cards.forEach((c) => {
        const isActive = c.dataset.role === role;
        c.classList.toggle("active", isActive);
        c.setAttribute("aria-pressed", isActive ? "true" : "false");
      });
      if (desc) desc.innerHTML = roleDescMap[role];
    }
  })();
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
